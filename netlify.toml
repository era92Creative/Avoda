# =============================================================================
# Avodah Contractors — Netlify config
# Ignored on Apache/cPanel hosting (see .htaccess for that).
# Netlify serves 404.html automatically and handles HTTPS + HSTS itself;
# set the canonical domain under Site settings -> Domain management.
# =============================================================================

[build]
  publish = "."

# Homepage has one URL, matching <link rel="canonical" href="https://avodahcontractors.com/">
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The Custom page was renamed to Residential. A permanent redirect keeps the
# old URL working and passes its ranking across; it was live and indexed, so
# dropping it would 404 every existing link.
[[redirects]]
  from = "/custom.html"
  to = "/residential.html"
  status = 301
  force = true

# Photos, video and icons never change in place — cache them hard.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The build guide is a static download that changes rarely; cache it hard so
# repeat visitors and email recipients don't re-pull a megabyte each time.
[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # Google indexes PDFs. Without this the guide could be found in search and
    # downloaded without ever filling in the form, defeating the lead magnet.
    X-Robots-Tag = "noindex, nofollow"

# The stylesheets and scripts are not content-hashed, so ANY TTL can pair a
# freshly revalidated HTML page with a stale stylesheet — which is how the
# equestrian CTA heading rendered crimson-on-crimson for up to an hour after a
# deploy. Revalidate on every request, like the HTML: the ETag still answers
# 304 with no body, so repeat visits cost one conditional request, not a
# re-download. Swap this for a long TTL only once the filenames are hashed.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
