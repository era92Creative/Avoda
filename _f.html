<script>
var ws=[320,390,560,768,1024,1440,1920];

setTimeout(function(){
 document.getElementById('o').textContent=fs.map(function(f,i){
  var d=f.contentDocument, de=d.documentElement;
  var nav=d.querySelector('.footer-legal'), bot=d.querySelector('.footer-bottom');
  var r=nav.getBoundingClientRect(), br=bot.getBoundingClientRect();
  var ov=de.scrollWidth>de.clientWidth+1;

   +getComputedStyle(nav.querySelector('a')).fontSize
   +'  insideFooter='+(r.left>=br.left-1 && r.right<=br.right+1)
   +'  overflow='+(ov?'YES':'no');
 }).join('\n');
},8000);
